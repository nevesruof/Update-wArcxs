<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>take</title>
<!-- TKWM-40632a5f-41f0-9fe6-22f804d522ac -->
<!-- Entrada de la T y, unos segundos despues, redireccion al portfolio. Cambia DEST / DELAY_MS si hace falta. -->
<noscript><meta http-equiv="refresh" content="3;url=https://arcxsdev.com/"></noscript>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .intro { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 3.5rem; animation: in .7s cubic-bezier(.22, 1, .36, 1) both; }
  .logo { width: 148px; aspect-ratio: 150 / 84; display: block; object-fit: contain; }
  .name { margin: 2.8rem 0 0; color: rgba(255, 255, 255, .8); font: clamp(11px, 2vw, 13px) ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .35em; text-transform: uppercase; user-select: none; }
  @keyframes in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .go { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  .go.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .intro { animation: none; } .go { transition: none; } }
</style>
</head>
<body>
<div class="intro"><img class="logo" src="/images/logo.webp" alt="" width="148" height="83"><p class="name">Take</p></div>
<div class="go" id="go"></div>
<script>
  var DEST = 'https://arcxsdev.com/', DELAY_MS = 2600;
  setTimeout(function () { document.getElementById('go').className = 'go on'; }, DELAY_MS - 450);
  setTimeout(function () { location.replace(DEST); }, DELAY_MS);
</script>
</body>
</html>
